[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "baoiad"
version = "1.1.0"
description = "BaoIAD: Unified Industrial Anomaly Detection Benchmark (OpenMMLab style)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Chenjie Xu"},
    {name = "Yang Zhang"},
    {name = "Tianyun Hu"},
    {name = "Bing Hu"},
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mmengine>=0.10",
    "mmcv-lite>=2.0",
    "torch>=2.0",
    "torchvision",
    "timm>=0.9",
    "Pillow",
    "scipy",
    "scikit-learn",
    "einops",
    "opencv-python-headless",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
    "tomli>=2.0; python_version < '3.11'",
]
flow = ["FrEIA>=0.2", "networkx", "mpmath", "scikit-image"]
vl = ["open_clip_torch"]
saa = ["groundingdino-py==0.4.0", "segment-anything==1.0"]
geomloss = ["geomloss"]
glass = ["pandas", "openpyxl"]
visualization = ["matplotlib"]
faiss-cpu = ["faiss-cpu"]
all = [
    "baoiad[flow,vl,saa,geomloss,glass,visualization,faiss-cpu]",
]

[project.urls]
Homepage = "https://github.com/Baosight-xVue/BaoIAD"
Repository = "https://github.com/Baosight-xVue/BaoIAD"
Documentation = "https://baoiad.readthedocs.io/en/latest/"
Issues = "https://github.com/Baosight-xVue/BaoIAD/issues"
Changelog = "https://github.com/Baosight-xVue/BaoIAD/blob/master/docs/en/notes/changelog.md"

[tool.setuptools.packages.find]
include = ["baoiad*"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
markers = [
    "offline: network-free tests that require no datasets, checkpoints, or accelerators",
    "network: tests that require external network access",
    "gpu: tests that require a real GPU or accelerator runtime",
    "slow: tests intentionally excluded from the fail-fast pull-request lane",
    "optional: tests that require an optional dependency group or release-excluded research tool",
]
