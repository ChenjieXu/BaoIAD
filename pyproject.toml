[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "baoiad"
version = "0.1.0"
description = "BaoIAD: Unified Industrial Anomaly Detection Benchmark (OpenMMLab style)"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "mmengine>=0.10",
    "mmcv-lite>=2.0",
    "torch>=2.0",
    "torchvision",
    "timm>=0.9",
    "Pillow",
    "scipy",
    "scikit-learn",
    "einops",
    "opencv-python-headless",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pre-commit"]
flow = ["FrEIA>=0.2", "networkx", "mpmath", "scikit-image"]
vl = ["open_clip_torch"]
saa = ["groundingdino-py==0.4.0", "segment-anything==1.0"]
geomloss = ["geomloss"]
glass = ["pandas", "openpyxl"]
visualization = ["matplotlib"]
faiss-cpu = ["faiss-cpu"]
all = [
    "baoiad[flow,vl,saa,geomloss,glass,visualization,faiss-cpu]",
]

[tool.setuptools.packages.find]
include = ["baoiad*"]
