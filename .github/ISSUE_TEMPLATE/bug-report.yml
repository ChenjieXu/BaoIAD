name: Bug report
description: Report a reproducible BaoIAD defect. Do not disclose vulnerabilities here.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Security-sensitive details must not be posted publicly; read SECURITY.md first.
  - type: input
    id: baoiad_version
    attributes:
      label: BaoIAD version or exact commit
      placeholder: v1.1.0 or a full commit SHA
    validations:
      required: true
  - type: textarea
    id: runtime_versions
    attributes:
      label: Python and framework versions
      description: Include Python, PyTorch, MMEngine, and MMCV or mmcv-lite versions.
      render: text
    validations:
      required: true
  - type: textarea
    id: platform
    attributes:
      label: Operating system and accelerator
      description: Include OS, architecture, CUDA/driver and GPU model, or state CPU-only.
      render: text
    validations:
      required: true
  - type: input
    id: config
    attributes:
      label: Method config
      placeholder: configs/patchcore/patchcore_wrn50_256_mvtec_strict.py
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command
      render: shell
    validations:
      required: true
  - type: input
    id: dataset
    attributes:
      label: Dataset and category
      description: Do not attach licensed or private dataset content.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Give the smallest deterministic sequence that demonstrates the defect.
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Traceback or observed output
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Public-report checklist
      options:
        - label: I removed credentials, internal paths, private data, and restricted assets.
          required: true
        - label: This report does not disclose a suspected security vulnerability.
          required: true
